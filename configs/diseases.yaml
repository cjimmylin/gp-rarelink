# Pilot diseases for the six-disease study: corpus search and screening settings.
# Slugs are the folder names under data/literature/. Facts about each disease are
# the ones CONTEXT.md §4 states (gene, OMIM, ORPHA, inheritance). Queries are run
# by build_manifest.py from database inception (pre-registration §5.1 [proposed]);
# the filter is the same case/patient/family clause the HA20 pilot used.
#
# Comparator holdouts: natural-history or genotype-first cohort papers held out of
# the extraction corpus for the bias arm (pre-registration §7.4.1, D-04). They are
# listed by background-manifest key and PMID; holdouts.py marks them out of the
# corpus after screening. ClinVar-cited PMIDs are NOT used as seeds (pre-registration
# §5.1; D-19 still open).

filter: '("case reports"[pt] OR "case report"[tiab] OR patient*[tiab] OR cohort[tiab] OR family[tiab] OR families[tiab])'

diseases:
  axd:
    name: Alexander disease
    gene: GFAP
    omim: "203450"
    orpha: "58"
    inheritance: autosomal dominant, mostly de novo
    definition: the leukodystrophy caused by heterozygous (usually de novo) GFAP variants
    not_this_disease:
      - GFAP used as an astrocyte or glial marker (immunostaining, gliosis, tumours)
      - serum or CSF GFAP as a biomarker of brain injury, stroke, multiple sclerosis or neurodegeneration
      - autoimmune GFAP astrocytopathy (anti-GFAP antibodies), which is a different disease
      - other leukodystrophies without a GFAP variant
    query: '("Alexander disease"[tiab] OR "Alexander''s disease"[tiab] OR "Alexander Disease"[MeSH] OR (GFAP[tiab] AND (leukodystroph*[tiab] OR leukoencephalopath*[tiab])))'
    key_reviews: {grossi2024: "39420046"}
    background_keys: [grossi2024_axd_meta, prust2011_axd_onset, messing2025_axd_14variants, genereviews_axd]
    holdouts: {mura2021_axd_italian: "34865968", gagliardi2024_axd_ukb: "39643430"}
  lad1:
    name: leukocyte adhesion deficiency type I (LAD-I)
    gene: ITGB2
    omim: "116920"
    orpha: "2968"
    inheritance: autosomal recessive
    definition: the primary immunodeficiency caused by biallelic ITGB2 variants (CD18 deficiency)
    not_this_disease:
      - LAD type II (SLC35C1) or LAD type III (FERMT3/kindlin-3); a paper on these is "no" unless it also describes LAD-I patients
      - ITGB2/CD18 biology, integrin signalling or leukocyte trafficking without patients
      - ITGB2 expression in cancer or common-disease association studies
    query: '("leukocyte adhesion deficiency"[tiab] OR "leucocyte adhesion deficiency"[tiab] OR "Leukocyte-Adhesion Deficiency Syndrome"[MeSH] OR "CD18 deficiency"[tiab] OR ITGB2[tiab] OR ITGB2[Gene Name])'
    key_reviews: {almarzanovoa2018: "29371071"}
    background_keys: [almarzanovoa2018_lad1_review, kambli2020_lad_india, qasim2009_lad_hsct, booth2025_lad_gene_therapy]
    holdouts: {}
  ssadh:
    name: succinic semialdehyde dehydrogenase (SSADH) deficiency
    gene: ALDH5A1
    omim: "271980"
    orpha: "22"
    inheritance: autosomal recessive
    definition: the neurometabolic disorder caused by biallelic ALDH5A1 variants (4-hydroxybutyric aciduria)
    not_this_disease:
      - GHB (gamma-hydroxybutyrate) drug use, intoxication or treatment of narcolepsy or alcohol dependence
      - ALDH5A1 polymorphisms in association studies without SSADH-deficient patients
      - animal models (Aldh5a1 knockout mice) with no patients
    query: '("succinic semialdehyde dehydrogenase deficiency"[tiab] OR "SSADH deficiency"[tiab] OR SSADHD[tiab] OR "4-hydroxybutyric aciduria"[tiab] OR "gamma-hydroxybutyric aciduria"[tiab] OR "4-hydroxybutyricaciduria"[tiab] OR ALDH5A1[tiab] OR ALDH5A1[Gene Name])'
    key_reviews: {didiasova2020: "32093054"}
    background_keys: [didiasova2020_ssadh_update, tokatlylatzer2023_ssadh_genotype, tokatlylatzer2024_ssadh_guidelines, pearl2003_ssadh_series, genereviews_ssadh]
    holdouts: {dibacco2019_ssadh_natural_history: "30656189"}
  danon:
    name: Danon disease
    gene: LAMP2
    omim: "300257"
    orpha: "34587"
    inheritance: X-linked dominant
    definition: the cardiomyopathy and myopathy caused by LAMP2 variants (LAMP-2 deficiency, glycogen storage disease IIb)
    not_this_disease:
      - LAMP-2 (or LAMP2A) in autophagy, cancer or neurodegeneration biology without patients
      - anti-LAMP-2 antibodies in ANCA-associated vasculitis or glomerulonephritis, which is a different condition
      - other glycogen storage diseases (for example Pompe disease) without a LAMP2 variant
    query: '("Danon disease"[tiab] OR "Danon''s disease"[tiab] OR "Glycogen Storage Disease Type IIb"[MeSH] OR "LAMP-2 deficiency"[tiab] OR "LAMP2 deficiency"[tiab] OR (LAMP2[tiab] AND (cardiomyopath*[tiab] OR myopath*[tiab] OR mutation*[tiab] OR variant*[tiab])))'
    key_reviews: {brambatti2019: "30857840"}
    background_keys: [brambatti2019_danon_gender, cenacchi2020_danon_review, sugie2024_danon_history, genereviews_danon]
    holdouts: {boucek2011_danon_natural_history: "21415759", khedro2025_danon_prospective: "41121270"}
  tangier:
    name: Tangier disease
    gene: ABCA1
    omim: "205400"
    orpha: "31150"
    inheritance: autosomal recessive
    definition: the near-absence of HDL caused by biallelic ABCA1 variants
    not_this_disease:
      - ABCA1 polymorphisms or expression in association studies of lipids, coronary disease, diabetes or Alzheimer disease, without individual patients
      - ABCA1 cholesterol-efflux biology without patients
    unclear_note: heterozygous ABCA1 carriers with familial HDL deficiency (not Tangier disease) are "unclear", so the full text decides
    query: '("Tangier disease"[tiab] OR "Tangier Disease"[MeSH] OR "analphalipoproteinemia"[tiab] OR (ABCA1[tiab] AND ("HDL deficiency"[tiab] OR hypoalphalipoproteinemia[tiab] OR "low HDL"[tiab])))'
    key_reviews: {koseki2021: "33994407"}
    background_keys: [koseki2021_tangier_review, puntoni2012_tangier, mercan2018_tangier_neuropathy, schaefer2016_hdl_deficiency, genereviews_tangier]
    holdouts: {}

  # ---- Extension diseases (D-52, recorded as D-47 in the extension session, 2026-11-14; preregistration/addendum_extension_v1.md) ----
  # Identifiers verified in Mondo release 2026-10-06. No holdouts: the bias arm is not
  # extended (addendum §4). Key reviews verified in Europe PMC on 2026-11-14.
  # Majeed syndrome was the sixth; the addendum's rule dropped it. Its entry as that session wrote it is kept in
  # data/literature/majeed/extension_first_pass_2026-11-14/config_entry.yaml; the entry in use is under `substitutes`.
  blau:
    name: Blau syndrome (early-onset sarcoidosis)
    gene: NOD2
    omim: "186580"
    orpha: "90340"
    inheritance: autosomal dominant (familial or de novo)
    definition: the granulomatous autoinflammatory disease (Blau syndrome, also called early-onset sarcoidosis or pediatric granulomatous arthritis) caused by heterozygous NOD2 variants
    not_this_disease:
      - NOD2 (CARD15) in Crohn disease, inflammatory bowel disease, graft-versus-host disease or other common-disease association or susceptibility studies
      - NOD2 receptor biology, microbiome or innate-immunity studies without Blau syndrome patients
      - adult sarcoidosis without a NOD2 variant or a Blau syndrome diagnosis
      - Yao syndrome (NOD2-associated autoinflammatory disease with the IVS8+158 / R702W carrier pattern), which is a different condition
    unclear_note: a granulomatous arthritis, uveitis or dermatitis patient without genetic testing who is called Blau syndrome or early-onset sarcoidosis is "unclear", so the full text decides
    query: '("Blau syndrome"[tiab] OR "Blau''s syndrome"[tiab] OR "Blau Syndrome"[Supplementary Concept] OR "early-onset sarcoidosis"[tiab] OR "early onset sarcoidosis"[tiab] OR "juvenile systemic granulomatosis"[tiab] OR "pediatric granulomatous arthritis"[tiab] OR "paediatric granulomatous arthritis"[tiab] OR "familial granulomatous arthritis"[tiab] OR ((NOD2[tiab] OR CARD15[tiab]) AND (granulomat*[tiab] OR sarcoid*[tiab])))'
    key_reviews: {wouters2014: "25136265", wang2025: "40456554"}
    background_keys: [wouters2014_blau, rose2015_blau_cohort, wang2025_blau_review]
    holdouts: {}
  lcat:
    name: familial LCAT deficiency (complete deficiency, Norum disease, and partial deficiency, fish-eye disease)
    gene: LCAT
    omim: "245900"
    orpha: "650"
    inheritance: autosomal recessive
    definition: the lipoprotein disorder (corneal opacity, low HDL, and in complete deficiency anaemia and kidney disease) caused by biallelic LCAT variants; both complete (familial LCAT deficiency) and partial (fish-eye disease) forms count
    not_this_disease:
      - acquired LCAT deficiency (for example autoantibodies against LCAT, liver disease) without LCAT variants
      - LCAT polymorphisms or plasma LCAT activity in association studies of lipids, coronary disease or other common conditions, without individual patients
      - recombinant LCAT or LCAT activators studied without patients
    unclear_note: heterozygous LCAT carriers studied for HDL or atherosclerosis are "unclear", so the full text decides
    query: '("LCAT deficiency"[tiab] OR "lecithin-cholesterol acyltransferase deficiency"[tiab] OR "lecithin:cholesterol acyltransferase deficiency"[tiab] OR "lecithin cholesterol acyltransferase deficiency"[tiab] OR "Lecithin Cholesterol Acyltransferase Deficiency"[MeSH] OR "fish-eye disease"[tiab] OR "fish eye disease"[tiab] OR "Norum disease"[tiab] OR (LCAT[tiab] AND (mutation*[tiab] OR variant*[tiab] OR deficien*[tiab])))'
    key_reviews: {vitali2022: "35065092"}
    background_keys: [vitali2022_lcat]
    holdouts: {}
  gamt:
    name: guanidinoacetate methyltransferase (GAMT) deficiency
    gene: GAMT
    omim: "612736"
    orpha: "382"
    inheritance: autosomal recessive
    definition: the cerebral creatine deficiency syndrome (intellectual disability, seizures, movement disorder, raised guanidinoacetate) caused by biallelic GAMT variants
    not_this_disease:
      - the other cerebral creatine deficiencies, AGAT (GATM) deficiency and creatine transporter (SLC6A8) deficiency, unless the paper also describes GAMT-deficient patients
      - guanidinoacetate or creatine metabolism studied in animals, cell models or healthy people without GAMT-deficient patients
      - newborn screening method papers that report no individual patient
    query: '("GAMT deficiency"[tiab] OR "guanidinoacetate methyltransferase deficiency"[tiab] OR "guanidinoacetate N-methyltransferase deficiency"[tiab] OR (GAMT[tiab] AND (deficien*[tiab] OR mutation*[tiab] OR variant*[tiab])) OR ("guanidinoacetate methyltransferase"[tiab] AND (patient*[tiab] OR deficien*[tiab])) OR ("cerebral creatine deficiency"[tiab] AND guanidinoacetate[tiab]))'
    key_reviews: {stockleripsiroglu2014: "24268530", biagiotti2025: "41373441"}
    background_keys: [stockleripsiroglu2014_gamt, biagiotti2025_gamt_review]
    holdouts: {}
  ats:
    name: arterial tortuosity syndrome
    gene: SLC2A10
    omim: "208050"
    orpha: "3342"
    inheritance: autosomal recessive
    definition: the connective tissue disorder (elongated and tortuous large and medium arteries, stenoses, aneurysms, skin and joint laxity) caused by biallelic SLC2A10 variants
    not_this_disease:
      - arterial tortuosity as an imaging finding in other conditions (Loeys-Dietz syndrome, Marfan syndrome, cutis laxa, Ehlers-Danlos syndromes, ageing) without SLC2A10 variants
      - SLC2A10 (GLUT10) in diabetes or metabolic association studies without patients with the syndrome
      - arterial tortuosity-bone fragility syndrome or other tortuosity syndromes caused by other genes
    query: '("arterial tortuosity syndrome"[tiab] OR "Arterial Tortuosity Syndrome"[Supplementary Concept] OR SLC2A10[tiab] OR ("arterial tortuosity"[tiab] AND GLUT10[tiab]))'
    key_reviews: {beyens2018: "29323665"}
    background_keys: [beyens2018_ats]
    holdouts: {}
  papa:
    name: PAPA syndrome and the PSTPIP1-associated inflammatory spectrum
    gene: PSTPIP1
    omim: "604416"
    orpha: "69126"
    inheritance: autosomal dominant
    definition: the autoinflammatory disease caused by heterozygous PSTPIP1 variants, pyogenic sterile arthritis, pyoderma gangrenosum and acne (PAPA) and its spectrum, including PSTPIP1-associated myeloid-related proteinaemia inflammatory syndrome (PAMI, hyperzincaemia and hypercalprotectinaemia)
    not_this_disease:
      - pyoderma gangrenosum, hidradenitis suppurativa or acne without a PSTPIP1 variant or a PAPA diagnosis (for example PASH or PAPASH without genetic findings, or with variants only in other genes)
      - PSTPIP1 cell-biology or inflammasome studies without patients
    unclear_note: a patient called PAPA, PASH or PAPASH syndrome on clinical grounds whose genetic testing is not reported is "unclear", so the full text decides
    query: '("PAPA syndrome"[tiab] OR "Pyogenic Arthritis, Pyoderma Gangrenosum, and Acne"[Supplementary Concept] OR "pyogenic arthritis, pyoderma gangrenosum and acne"[tiab] OR "pyogenic arthritis, pyoderma gangrenosum, and acne"[tiab] OR "pyogenic sterile arthritis"[tiab] OR "PAMI syndrome"[tiab] OR "PSTPIP1-associated"[tiab] OR "hyperzincaemia and hypercalprotectinaemia"[tiab] OR "hyperzincemia and hypercalprotectinemia"[tiab] OR PSTPIP1[tiab] OR "CD2BP1"[tiab])'
    key_reviews: {genovese2020: "32618443", satoh2024: "38031879"}
    background_keys: [genovese2020_papa_spectrum, satoh2024_pg_genetics]
    holdouts: {}


# Substitute diseases (pre-registration §4.2). Not part of the six-disease study:
# a corpus here is preparation only, and any substitution or stretch extension is
# decided separately and logged in DECISIONS.md. Scripts that loop over the six
# read `diseases` only; the per-disease commands also look here.
substitutes:
  majeed:
    name: Majeed syndrome
    gene: LPIN2
    omim: "609628"
    orpha: "77297"
    mondo: "MONDO:0012316"   # Mondo release 2026-10-06 (sha256 matches data/ontologies/2026-10-19/manifest.json); OMIM and Orphanet numbers are its cross-references
    inheritance: autosomal recessive
    definition: the autoinflammatory syndrome of chronic recurrent multifocal osteomyelitis (CRMO or chronic nonbacterial osteomyelitis), congenital dyserythropoietic anaemia and often neutrophilic dermatosis, caused by biallelic LPIN2 variants
    not_this_disease:
      - isolated CRMO or chronic nonbacterial osteomyelitis (CNO), SAPHO or DIRA without an LPIN2 variant; a CRMO cohort that sequenced LPIN2 is "unclear" unless the abstract says no patient had biallelic variants
      - congenital dyserythropoietic anaemia types I-IV (CDAN1, SEC23B, KIF23, KLF1) without osteomyelitis or an LPIN2 variant
      - lipin-2 or lipin family biology (phosphatidate phosphatase, lipid metabolism, Lpin2 mouse models) with no patients
      - LPIN2 polymorphisms in association studies (lipids, diabetes, psoriasis) without individual patients
      - the word Majeed as an author's name or another eponym
    query: '("Majeed syndrome"[tiab] OR "Majeed syndrome"[nm] OR LPIN2[tiab] OR LPIN2[Gene Name] OR "lipin-2"[tiab] OR "lipin 2"[tiab] OR ("congenital dyserythropoietic"[tiab] AND osteomyelitis[tiab]) OR ("chronic recurrent multifocal osteomyelitis"[tiab] AND dyserythropoie*[tiab]) OR MJDS[tiab] OR (CRMO[tiab] AND CDA[tiab]))'
    query_filter_applied: false
    key_reviews: {ferguson2021: "33670882", chavan2021: "33993107", badiger2024: "37865862", wang2025: "41113563"}
    key_papers: {majeed1989: "2809904", majeed2001: "11795677", ferguson2005: "15994876", almosawi2007: "17330256", ferguson2021: "33670882"}
    background_keys: [ferguson2021_majeed]
    holdouts: {}
