# SLIDERS configuration for the GP-RareLink POC (HA20).
# Generated from the vendored default (.vendor/sliders/configs/default_sliders.yaml,
# upstream commit b66094d) with every model routed to Claude through the
# Anthropic provider patch. Sampling parameters are removed (current Claude
# models reject them); reasoning depth is set per role with `effort`:
#   high   extraction, schema completion, reconciliation, SQL answer steps
#   medium relevance gate, titles, descriptions, table summaries, guideline selection
# `temperature` keys must not be re-added. The pinned evidence schema is passed
# at run time (pipeline/extract/sliders_adapter/schema_ha20.json), so schema
# induction is bypassed. See POC_DESIGN.md §3.4.
experiment: sliders
system: sliders
system_config:
  generate_task_guidelines: false
  rephrase_question:
    enabled: true
    prompt_file: sliders/rephrase_question_component.prompt
    library_of_guidelines_path: sliders_taxonomy.json
  generate_schema:
    add_extra_information_class: false
    add_document_text: true
    generate_schema_type: library_based
    library_of_guidelines_path: sliders_taxonomy.json
  extract_schema:
    decompose_fields: false
    dedupe_merged_rows: false
    num_samples_per_chunk: 1
    is_relevant_chunk: true
    extract_quotes: true
  merge_tables:
    merge_strategy: reconciliation
    reconciliation:
      debug_mode: false
      primary_key_selection:
        version: v1
        max_candidates: 10
        max_inspections_per_candidate: 10
        max_retries: 3
      canonicalization:
        mode: two_pass
        max_cycles: 20
        max_retries_per_cycle: 3
        max_inspection_history: 3
        inspections_per_field: 50
        null_handling:
          max_inspections: 5
          placeholder_text: UNKNOWN
          verification:
            enable: false
            max_inspections: 5
      controller_executor_loop:
        max_iterations: 5
        max_controller_inspections: 5
        max_executor_inspections: 5
        max_sql_attempts: 3
        verification:
          enable: true
          max_inspections: 5
        context_generator:
          enable: true
          model: claude-opus-5-5
          max_rows: 20
      non_pk_canonicalization:
        enable: true
        inspections_per_field: 5
        column_selector:
          max_inspections: 5
          excluded_columns:
          - row_id
          - page_number
          - __reconciliation_context__
          - number_instances
          excluded_patterns:
          - _quote
          - _rationale
          - _confidence
      statistics:
        enable: true
        filename: reconciliation_stats.json
  inspect_answer:
    enable_citation_generation: true
    enable_reconciliation_stats_verbalization: true
  check_if_merge_needed: false
  force_sql: false
  answer_strategy: sql_inspect
  models:
    answer:
      model: claude-opus-5-5
      max_tokens: 8192
      provider: anthropic
      effort: high
    answer_no_table:
      model: claude-opus-5-5
      max_tokens: 8192
      provider: anthropic
      effort: medium
    answer_tool_output:
      model: claude-opus-5-5
      max_tokens: 8192
      provider: anthropic
      effort: high
    extract_schema:
      model: claude-opus-5-5
      max_tokens: 32000
      provider: anthropic
      effort: high
    generate_schema:
      model: claude-opus-5-5
      max_tokens: 8192
      provider: anthropic
      effort: high
    merge_tables:
      model: claude-opus-5-5
      max_tokens: 32000
      provider: anthropic
      effort: high
    task_guidelines:
      model: claude-opus-5-5
      max_tokens: 8192
      provider: anthropic
      effort: high
    check_objective_necessity:
      model: claude-opus-5-5
      max_tokens: 8192
      provider: anthropic
      effort: high
    rephrase_question:
      model: claude-opus-5-5
      max_tokens: 8192
      provider: anthropic
      effort: high
    direct_answer:
      model: claude-opus-5-5
      max_tokens: 8192
      provider: anthropic
      effort: high
    force_answer:
      model: claude-opus-5-5
      max_tokens: 8192
      provider: anthropic
      effort: high
    is_relevant_chunk:
      model: claude-opus-5-5
      max_tokens: 8192
      provider: anthropic
      effort: medium
    check_if_merge_needed:
      model: claude-opus-5-5
      max_tokens: 8192
      provider: anthropic
      effort: high
    select_guidelines_for_schema:
      model: claude-opus-5-5
      max_tokens: 2000
      provider: anthropic
      effort: medium
    select_primary_key:
      model: claude-opus-5-5
      max_tokens: 8192
      provider: anthropic
      effort: high
    canonicalize_fields:
      model: claude-opus-5-5
      max_tokens: 8192
      provider: anthropic
      effort: high
    column_selector:
      model: claude-opus-5-5
      max_tokens: 8192
      provider: anthropic
      effort: high
    context_generator:
      model: claude-opus-5-5
      max_tokens: 8192
      provider: anthropic
      effort: medium
    handle_null_pks:
      model: claude-opus-5-5
      max_tokens: 8192
      provider: anthropic
      effort: high
experiment_config:
  questions_path: null
  files_dir: null
  num_questions: null
  random_state: 42
  document_config:
    chunk_size: 16000
    overlap_size: 0
    title_model: claude-opus-5-5
    description_model: claude-opus-5-5
    table_summary_model: claude-opus-5-5
output_file: sliders_output.json
