# Majeed syndrome entry of configs/diseases.yaml as the extension session wrote it (branch claude/affectionate-babbage-tfrjur, 2026-11-14).
# Not read by any script; the entry in use is under `substitutes` in configs/diseases.yaml.
  majeed:
    name: Majeed syndrome
    gene: LPIN2
    omim: "609628"
    orpha: "77297"
    inheritance: autosomal recessive
    definition: the autoinflammatory disorder (chronic recurrent multifocal osteomyelitis with congenital dyserythropoietic anaemia, often with neutrophilic dermatosis) caused by biallelic LPIN2 variants
    not_this_disease:
      - chronic nonbacterial osteomyelitis or CRMO without LPIN2 variants (for example sporadic CRMO, SAPHO syndrome, IL1RN or other genes)
      - LPIN1 (rhabdomyolysis) or LPIN3, which are different genes
      - lipin biology or lipid-metabolism studies without patients
    query: '("Majeed syndrome"[tiab] OR "Majeed''s syndrome"[tiab] OR "Majeed Syndrome"[Supplementary Concept] OR LPIN2[tiab] OR "lipin-2"[tiab] OR "lipin 2"[tiab])'
    key_reviews: {ferguson2021: "33670882"}
    background_keys: [ferguson2021_majeed]
    holdouts: {}
