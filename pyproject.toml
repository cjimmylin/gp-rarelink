[project]
name = "gp-rarelink"
version = "0.0.1"
description = "GP-RareLink: literature-curated, database-validated genotype-phenotype records for rare disease"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "phenopackets==2.0.2.post5",
    "pyyaml>=6.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# Runtime dependencies of the extraction side. SLIDERS itself is installed by
# scripts/install_sliders.sh (pinned commit + Anthropic patch, no-deps); this
# group lists SLIDERS' dependencies minus docling (PDF conversion only).
extract = [
    "anthropic>=1.15",
    "langchain-anthropic>=1.7",
    "langchain>=0.3.3",
    "langchain-community>=0.3.2",
    "langchain-openai>=0.2.2",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.3.33",
    "duckdb>=1.2.2",
    "jinja2>=3.1",
    "loguru>=0.7.2",
    "marko>=2.1.3",
    "markdown>=3.8",
    "matplotlib>=3.9.2",
    "numpy>=1.26",
    "openai>=1.30",
    "opencv-python-headless>=4.8",
    "overrides>=7.7",
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0.0",
    "redis>=5.2.0",
    "retry>=0.9.2",
    "rich>=13.9.4",
    "tenacity>=8.3",
    "tqdm>=4.66",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One distribution, three subpackages. The import boundary between
# pipeline.extract and pipeline.harness is enforced by tests/test_isolation.py
# and by pipeline.extract.guard at run time, not by packaging.
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
